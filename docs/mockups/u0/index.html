<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GYM Club · Duyệt mockup U0</title>
  <style>
    @font-face{font-family:Be;src:url('../../../client/public/fonts/BeVietnamPro-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e6ebe9;color:#183e35;font:13px Be,Arial,sans-serif}.review{display:flex;align-items:center;gap:20px;padding:12px 24px;background:#fff;border-bottom:1px solid #ccd8d2;min-height:66px}.review-title{margin-right:auto}.review-title strong{font-size:15px}.review-title small{display:block;color:#5b6e65;margin-top:3px}.group{display:flex;align-items:center;gap:4px}button,select{font:inherit;border:1px solid #cbd6d0;background:#fff;color:inherit;border-radius:7px;min-height:36px;padding:6px 11px;cursor:pointer}button[aria-pressed=true]{background:#164c3e;color:white;border-color:#164c3e}button:focus-visible,select:focus-visible{outline:3px solid #b57432;outline-offset:3px}.frame-wrap{height:calc(100dvh - 66px);padding:16px;display:flex;justify-content:center;overflow:hidden}iframe{display:block;width:100%;height:100%;border:1px solid #c8d3cd;border-radius:10px;background:#f7f9f7;transition:width .2s}.phone iframe{width:390px;max-width:100%}.hint{font-size:11px;color:#647268}.mobile-label{display:none}@media(max-width:820px){.review{padding:10px 12px;gap:8px;flex-wrap:wrap}.review-title{width:100%;display:flex;align-items:center;gap:10px}.review-title small{margin:0}.review .devices{margin-left:auto}.hint{display:none}.frame-wrap{padding:8px;height:calc(100dvh - 103px)}}@media(max-width:440px){.devices{display:none!important}.frame-wrap{padding:0}.review{gap:6px}.review-title small{font-size:10px}button,select{font-size:11px;padding:6px 8px}iframe{border:0;border-radius:0}.frame-wrap{height:calc(100dvh - 99px)}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
  </style>
</head>
<body>
  <header class="review">
    <div class="review-title"><strong>GYM Club / U0</strong><small>Bản mẫu tương tác · Dữ liệu minh họa</small></div>
    <div class="group" aria-label="Màn hình"><button data-screen="home" aria-pressed="true">Trang chủ</button><button data-screen="booking" aria-pressed="false">Chọn lịch</button></div>
    <label><span class="hint">Tài khoản </span><select id="persona" aria-label="Trạng thái tài khoản"><option value="guest">Khách</option><option value="member">Hội viên mẫu</option><option value="expired">Thẻ hết hạn</option></select></label>
    <label><select id="scenario" aria-label="Tình huống dữ liệu"><option value="normal">Lịch bình thường</option><option value="loading">Đang tải lịch</option><option value="empty">Không có ca</option><option value="error">Lỗi kết nối</option></select></label>
    <div class="group devices" aria-label="Thiết bị"><button data-device="desktop" aria-pressed="true">Máy tính</button><button data-device="phone" aria-pressed="false">Điện thoại</button></div>
  </header>
  <main class="frame-wrap" id="frame-wrap"><iframe id="prototype" src="app.html" title="Bản mẫu GYM Club" allow="fullscreen"></iframe></main>
  <script>
    const frame=document.getElementById('prototype');
    function send(data){frame.contentWindow.postMessage({type:'u0-control',...data},'*')}
    document.querySelectorAll('[data-screen]').forEach(button=>button.addEventListener('click',()=>send({screen:button.dataset.screen})));
    document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('frame-wrap').classList.toggle('phone',button.dataset.device==='phone');document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b===button));}));
    document.getElementById('persona').addEventListener('change',e=>send({persona:e.target.value}));
    document.getElementById('scenario').addEventListener('change',e=>send({scenario:e.target.value}));
    window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='u0-state')return;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===e.data.screen));document.getElementById('persona').value=e.data.persona;document.getElementById('scenario').value=e.data.scenario||'normal';});
  </script>
  <style>body{height:100dvh;display:flex;flex-direction:column}.review{flex:none}.frame-wrap{height:auto;flex:1;min-height:0}</style>
</body>
</html>
