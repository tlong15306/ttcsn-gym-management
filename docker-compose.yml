services:
  postgres:
    image: postgres:17-alpine
    container_name: ttcsn-gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create infra/.env.compose from infra/.env.compose.example first}
      POSTGRES_DB: ttcsn_gym_dev
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ttcsn_gym_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_app -d ttcsn_gym_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ttcsn_gym_postgres_data:
